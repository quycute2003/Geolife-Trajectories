apiVersion: v1
kind: Namespace
metadata:
  name: geolife-knative
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: geolife-inference
  namespace: geolife-knative
  labels:
    networking.knative.dev/visibility: cluster-local
  annotations:
    networking.knative.dev/ingress-class: kourier.ingress.networking.knative.dev
spec:
  template:
    metadata:
      name: geolife-inference-blue
      annotations:
        autoscaling.knative.dev/min-scale: "0"
    spec:
      containerConcurrency: 1
      containers:
        - name: api
          image: registry.example.invalid/geolife/inference:0.2.0-postgres
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_VERSION
              value: heuristic-v1
            - name: GEOLIFE_SNAPSHOT_ID
              value: geolife-1.3-full-v1
            - name: GEOLIFE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: geolife-postgres
                  key: dsn
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
  traffic:
    - revisionName: geolife-inference-blue
      tag: blue
      percent: 100
