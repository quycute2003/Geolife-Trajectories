AWSTemplateFormatVersion: '2010-09-09'
Description: GeoLife Lambda demo with a read-only SQLite snapshot.

Parameters:
  ImageUri:
    Type: String
    AllowedPattern: '[0-9]{12}\.dkr\.ecr\.ap-southeast-2\.amazonaws\.com/[a-z0-9._/-]+@sha256:[a-f0-9]{64}'
  BlueVersion:
    Type: String
    Default: ''
    AllowedPattern: '^([1-9][0-9]*)?$'
  GreenVersion:
    Type: String
    Default: ''
    AllowedPattern: '^([1-9][0-9]*)?$'
  LatestModel:
    Type: String
    Default: heuristic-v1
    AllowedValues: [heuristic-v1, dbscan-v1]
  Traffic:
    Type: String
    Default: blue
    AllowedValues: [blue, canary, green]

Rules:
  RequirePublishedVersions:
    RuleCondition: !Not [!Equals [!Ref Traffic, blue]]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref BlueVersion, '']]
          - !Not [!Equals [!Ref GreenVersion, '']]
          - !Not [!Equals [!Ref BlueVersion, !Ref GreenVersion]]
        AssertDescription: Supply distinct published versions for Blue and Green.

Conditions:
  HasBlueVersion: !Not [!Equals [!Ref BlueVersion, '']]
  UseCanary: !Equals [!Ref Traffic, canary]
  UseGreen: !Equals [!Ref Traffic, green]

Resources:
  InferenceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteInferenceLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt InferenceLogs.Arn

  InferenceLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-infer'
      RetentionInDays: 7

  Inference:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-infer'
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      Role: !GetAtt InferenceRole.Arn
      MemorySize: 2048
      Timeout: 20
      Environment:
        Variables:
          MODEL_VERSION: !Ref LatestModel

  Prod:
    Type: AWS::Lambda::Alias
    Condition: HasBlueVersion
    Properties:
      Name: prod
      FunctionName: !Ref Inference
      FunctionVersion: !If [UseGreen, !Ref GreenVersion, !Ref BlueVersion]
      RoutingConfig:
        !If
          - UseCanary
          - AdditionalVersionWeights:
              - FunctionVersion: !Ref GreenVersion
                FunctionWeight: 0.1
          - !Ref AWS::NoValue

  Api:
    Type: AWS::ApiGatewayV2::Api
    Condition: HasBlueVersion
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: HasBlueVersion
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref Prod
      PayloadFormatVersion: '2.0'

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasBlueVersion
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /health
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${Integration}'

  VersionRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasBlueVersion
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /version
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${Integration}'

  InferRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: HasBlueVersion
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /v2/locations/infer
      AuthorizationType: AWS_IAM
      Target: !Sub 'integrations/${Integration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: HasBlueVersion
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true

  InvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasBlueVersion
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Prod
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/$default/*/*'

Outputs:
  FunctionName:
    Value: !Ref Inference
  ApiEndpoint:
    Condition: HasBlueVersion
    Value: !GetAtt Api.ApiEndpoint
