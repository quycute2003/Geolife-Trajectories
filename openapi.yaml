                      candidate:
                        cluster_id: 0
                        latitude: 39.9
                        longitude: 116.30000000000001
                        evidence_score: 0.975
                        evidence_components:
                          recurrence: 1.0
                          duration: 1.0
                          temporal_consistency: 1.0
                          coverage: 0.8333333333333334
                          relative_strength: 1.0
                        role_dwell_minutes: 600.0
                        role_visit_days: 5
                        relative_share: 1.0
                        eligible: true
                      alternatives: []
                    pois: []
                    locations:
                    - user_id: synthetic-user
                      cluster_id: 0
                      latitude: 39.9
                      longitude: 116.30000000000001
                      stay_event_count: 10
                      total_dwell_minutes: 1200.0
                      night_dwell_minutes: 600.0
                      weekday_dwell_minutes: 1200.0
