openapi: 3.1.0
info:
  title: Home / Office / Recurring Location Inference
  version: 0.2.0-draft
  description: |
    CP1 API design proposal for direct presentation. No HTTP implementation exists.
    Synchronous inference for one user's GPS history; POI means recurring location,
    not a business category. Scores are uncalibrated heuristic evidence, not probabilities.
    Unknown roles are successful completed inferences (200), including empty inputs.
    Proposed limits: 100000 points, 20 MiB decoded JSON body, 20000 stay events,
    60-second processing deadline; these are proposed service limits and require load tests before implementation.
    UTC input is required. Behavioral timezone is explicit and never inferred from coordinates.
    No dataset paths, URLs, cross-user requests or server-side file access are accepted.
    Production must use HTTPS, authentication, authorization for user_id, request size limits,
    no coordinate logging, no shared response caching, and no persistence by default.
    Deployment and enforcement belong to later approved API work.
tags:
  - name: locations
security:
  - bearerAuth: []
paths:
  /v1/locations/infer:
    post:
      tags: [locations]
      operationId: inferLocationsV1
      summary: Infer likely Home, Office and recurring locations for one user
      description: |
        Proposal only. Point ordering is normalized per trajectory. Each trajectory_id
        identifies a recording boundary; it must not be reused for unrelated recordings.
        Equal timestamp/coordinate duplicates are deduplicated. Equal-timestamp conflicts
        use spatial_vote_context_v2: mean nearby fixes, prefer the largest pairwise-close
        subset, then use unambiguous context from the same trajectory to break ties.
        Unresolved timestamps are separated and break observation segments.
        Mean contributors and rejected fixes are traceable in offline preprocessing outputs.
        No continuity is inferred between trajectory IDs or across excessive sampling gaps.
        A candidate may serve both Home and Office. Either or both roles may be unknown.
        Scores describe evidence under assumptions, never verified residence or employment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRequest'
            examples:
              shortStop:
                summary: Synthetic 10-minute stop; insufficient recurrence for either role
                value:
                  user_id: synthetic-user
                  model_version: dbscan-v1
                  config:
                    timezone: Asia/Shanghai
                  points:
                    - {trajectory_id: t1, latitude: 39.9, longitude: 116.3, timestamp: '2024-01-01T00:00:00Z'}
                    - {trajectory_id: t1, latitude: 39.9, longitude: 116.3, timestamp: '2024-01-01T00:05:00Z'}
                    - {trajectory_id: t1, latitude: 39.9, longitude: 116.3, timestamp: '2024-01-01T00:10:00Z'}
              empty:
                summary: Valid empty input returns completed inference with unknown roles
                value: {user_id: synthetic-user, points: []}
      responses:
        '200':
          description: Completed, including insufficient evidence and unknown roles
          headers:
            Cache-Control:
              description: Must be no-store for sensitive location results
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceResponse'
              examples:
                insufficientData:
                  summary: Synthetic empty input; valid completed inference with unknown roles
                  value:
                    inference_id: 01c33de4-fd82-5e48-b778-ffac02b00c1c
                    user_id: synthetic-user
                    model_version: dbscan-v1
                    pipeline_version: 0.2.0
                    status: completed
                    timezone: Asia/Shanghai
                    config:
                      timezone: Asia/Shanghai
                      distance_m: 100.0
                      min_stay_minutes: 10.0
                      max_gap_minutes: 5.0
                      conflict_merge_threshold_m: 20.0
                      eps_m: 100.0
                      min_samples: 3
                      speed_warning_mps: 100.0
                      night_start_hour: 22
                      night_end_hour: 6
                      work_start_hour: 9
                      work_end_hour: 18
                      min_role_days: 3
                      min_office_weeks: 2
                      min_role_dwell_minutes: 60.0
                      min_evidence_score: 0.5
                      min_candidate_share: 0.5
                      min_poi_days: 3
                      max_pois: 10
                    score_semantics: Uncalibrated heuristic evidence score in [0,1]; not a probability.
                    home:
                      status: unknown
                      reason: insufficient_evidence
                      candidate: null
                      alternatives: []
                    office:
                      status: unknown
                      reason: insufficient_evidence
                      candidate: null
                      alternatives: []
                    pois: []
                    locations: []
                    coverage:
                      observed_minutes: 0.0
                      observed_days: 0
                      calendar_span_days: 0
                      observed_day_fraction: 0.0
                      observed_time_fraction: 0.0
                      night_observed_days: 0
                      work_observed_days: 0
                      first_timestamp: null
                      last_timestamp: null
                    diagnostics:
                      input_points: 0
                      invalid_coordinates: 0
                      invalid_timestamps: 0
                      invalid_rows_removed: 0
                      invalid_altitudes: 0
                      duplicate_records_removed: 0
                      conflicting_timestamps_removed: 0
                      gaps_over_limit: 0
                      high_speed_segments: 0
                      output_points: 0
                      overlapping_stays_removed: 0
                      stay_events: 0
                      location_clusters: 0
                      noise_stays: 0
                      noise_proportion: 0.0
                    warnings:
                    - timezone_is_user_selected_assumption
                    - evidence_score_is_not_probability
                    - sparse_observation_days
                sharedHomeOffice:
                  summary: Synthetic repeated day/night observations; both roles share a location,
                    not ground truth
                  value:
                    inference_id: 6378858a-ca91-5bd7-ab53-4a986212eb6a
                    user_id: synthetic-user
                    model_version: dbscan-v1
                    pipeline_version: 0.2.0
