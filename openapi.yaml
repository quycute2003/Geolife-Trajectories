openapi: 3.1.0
info:
  title: Home / Office / Recurring Location Inference
  version: 0.2.0-draft
  description: |
    Draft production contract with a loopback-only CP2 implementation for local verification.
    Synchronous inference for one user's GPS history; POI means recurring location,
    not a business category. Scores are uncalibrated heuristic evidence, not probabilities.
    Unknown roles are successful completed inferences (200), including empty inputs.
    The local server limits on-demand inference to 100000 points and request bodies to 20 MiB.
    A 20000-stay limit and 60-second deadline are proposed production limits pending load tests.
    UTC input is required. Behavioral timezone is explicit and never inferred from coordinates.
    Requests do not accept dataset paths, URLs, or cross-user input.
    Production must use HTTPS, authentication, authorization for user_id, request size limits,
    no coordinate logging, no shared response caching, and no persistence by default.
    The bearer authentication, rate limits and processing limits below describe production behavior.
    The local server accepts requests without credentials on 127.0.0.1.
tags:
  - name: locations
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check whether the API can respond to HTTP requests
      security: []
      responses:
        '200':
          description: API is responding
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /version:
    get:
      operationId: getVersion
      summary: Identify the pipeline and default model and configuration served by this instance
      description: Defaults apply when the inference request omits model and configuration overrides.
      security: []
      responses:
        '200':
          description: Serving defaults and configuration fingerprint
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [model_version, pipeline_version, config_version, config_sha256]
                properties:
                  model_version: {$ref: '#/components/schemas/ModelVersion'}
                  pipeline_version: {type: string}
                  config_version: {type: string}
                  config_sha256: {$ref: '#/components/schemas/InferenceResponse/properties/config_sha256'}
  /v1/locations/infer:
    post:
      tags: [locations]
      operationId: inferLocationsV1
      summary: Infer likely Home, Office and recurring locations for one user
      description: |
        Point ordering is normalized per trajectory. Each trajectory_id
        identifies a recording boundary; it must not be reused for unrelated recordings.
        Equal timestamp/coordinate duplicates are deduplicated. Equal-timestamp conflicts
        use spatial_vote_context_v2: mean nearby fixes, prefer the largest pairwise-close
        subset, then use unambiguous context from the same trajectory to break ties.
        Unresolved timestamps are separated and break observation segments.
        Mean contributors and rejected fixes are traceable in offline preprocessing outputs.
        No continuity is inferred between trajectory IDs or across excessive sampling gaps.
        A candidate may serve both Home and Office. Either or both roles may be unknown.
        Scores describe evidence under assumptions, never verified residence or employment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferenceRequest'
            examples:
              shortStop:
                summary: Synthetic 10-minute stop; insufficient recurrence for either role
                value:
                  user_id: synthetic-user
                  model_version: dbscan-v1
                  config_version: baseline-v1
                  points:
                    - {trajectory_id: t1, latitude: 39.9, longitude: 116.3, timestamp: '2024-01-01T00:00:00Z'}
                    - {trajectory_id: t1, latitude: 39.9, longitude: 116.3, timestamp: '2024-01-01T00:05:00Z'}
                    - {trajectory_id: t1, latitude: 39.9, longitude: 116.3, timestamp: '2024-01-01T00:10:00Z'}
              empty:
                summary: Valid empty input returns completed inference with unknown roles
                value: {user_id: synthetic-user, points: []}
      responses:
        '200':
          description: Completed, including insufficient evidence and unknown roles
          headers:
            Cache-Control:
              description: Must be no-store for sensitive location results
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceResponse'
              examples:
                insufficientData:
                  summary: Synthetic empty input; valid completed inference with unknown roles
                  value:
                    inference_id: 01c33de4-fd82-5e48-b778-ffac02b00c1c
                    user_id: synthetic-user
                    model_version: dbscan-v1
                    pipeline_version: 0.2.0
                    config_version: baseline-v1
                    config_sha256: a1e6ce4aac7398df9df9f66d768fcafee50cea241f94bc48654e4717ea5dc6ea
                    status: completed
                    timezone: Asia/Shanghai
                    config:
                      timezone: Asia/Shanghai
                      distance_m: 100.0
                      min_stay_minutes: 10.0
                      max_gap_minutes: 5.0
                      conflict_merge_threshold_m: 20.0
                      eps_m: 100.0
                      min_samples: 3
                      speed_warning_mps: 100.0
                      night_start_hour: 22
                      night_end_hour: 6
                      work_start_hour: 9
                      work_end_hour: 18
                      min_role_days: 3
                      min_office_weeks: 2
                      min_role_dwell_minutes: 60.0
                      min_evidence_score: 0.5
                      min_candidate_share: 0.5
                      min_poi_days: 3
                      max_pois: 10
                    score_semantics: Uncalibrated heuristic evidence score in [0,1]; not a probability.
                    home:
                      status: unknown
                      reason: insufficient_evidence
                      candidate: null
                      alternatives: []
                    office:
                      status: unknown
                      reason: insufficient_evidence
                      candidate: null
                      alternatives: []
                    pois: []
                    locations: []
                    coverage:
                      observed_minutes: 0.0
                      observed_days: 0
                      calendar_span_days: 0
                      observed_day_fraction: 0.0
                      observed_time_fraction: 0.0
                      night_observed_days: 0
                      work_observed_days: 0
                      first_timestamp: null
                      last_timestamp: null
                    diagnostics:
                      input_points: 0
                      invalid_coordinates: 0
                      invalid_timestamps: 0
                      invalid_rows_removed: 0
                      invalid_altitudes: 0
                      duplicate_records_removed: 0
                      conflicting_timestamps_removed: 0
                      gaps_over_limit: 0
                      high_speed_segments: 0
                      output_points: 0
                      overlapping_stays_removed: 0
                      stay_events: 0
                      location_clusters: 0
                      noise_stays: 0
                      noise_proportion: 0.0
                    warnings:
                    - timezone_is_user_selected_assumption
                    - evidence_score_is_not_probability
                    - sparse_observation_days
                sharedHomeOffice:
                  summary: Synthetic repeated day/night observations; both roles share a location,
                    not ground truth
                  value:
                    inference_id: 6378858a-ca91-5bd7-ab53-4a986212eb6a
                    user_id: synthetic-user
                    model_version: dbscan-v1
                    pipeline_version: 0.2.0
                    config_version: baseline-v1
                    config_sha256: a1e6ce4aac7398df9df9f66d768fcafee50cea241f94bc48654e4717ea5dc6ea
                    status: completed
                    timezone: Asia/Shanghai
                    config:
                      timezone: Asia/Shanghai
                      distance_m: 100.0
                      min_stay_minutes: 10.0
                      max_gap_minutes: 5.0
                      conflict_merge_threshold_m: 20.0
                      eps_m: 100.0
                      min_samples: 3
                      speed_warning_mps: 100.0
                      night_start_hour: 22
                      night_end_hour: 6
                      work_start_hour: 9
                      work_end_hour: 18
                      min_role_days: 3
                      min_office_weeks: 2
                      min_role_dwell_minutes: 60.0
                      min_evidence_score: 0.5
                      min_candidate_share: 0.5
                      min_poi_days: 3
                      max_pois: 10
                    score_semantics: Uncalibrated heuristic evidence score in [0,1]; not a probability.
                    home:
                      status: predicted
                      reason: sufficient_heuristic_evidence
                      candidate:
                        cluster_id: 0
                        latitude: 39.9
                        longitude: 116.30000000000001
                        evidence_score: 0.975
                        evidence_components:
                          recurrence: 1.0
                          duration: 1.0
                          temporal_consistency: 1.0
                          coverage: 0.8333333333333334
                          relative_strength: 1.0
                        role_dwell_minutes: 600.0
                        role_visit_days: 5
                        relative_share: 1.0
                        eligible: true
                      alternatives: []
                    office:
                      status: predicted
                      reason: sufficient_heuristic_evidence
                      candidate:
                        cluster_id: 0
                        latitude: 39.9
                        longitude: 116.30000000000001
                        evidence_score: 0.975
                        evidence_components:
                          recurrence: 1.0
                          duration: 1.0
                          temporal_consistency: 1.0
                          coverage: 0.8333333333333334
                          relative_strength: 1.0
                        role_dwell_minutes: 600.0
                        role_visit_days: 5
                        relative_share: 1.0
                        eligible: true
                      alternatives: []
                    pois: []
                    locations:
                    - user_id: synthetic-user
                      cluster_id: 0
                      latitude: 39.9
                      longitude: 116.30000000000001
                      stay_event_count: 10
                      total_dwell_minutes: 1200.0
                      night_dwell_minutes: 600.0
                      weekday_dwell_minutes: 1200.0
                      weekday_daytime_dwell_minutes: 600.0
                      weekend_dwell_minutes: 0.0
                      visit_count: 10
                      unique_visit_days: 7
                      distinct_weeks: 2
                      night_visit_days: 5
                      weekday_daytime_visit_days: 5
                      weekday_daytime_weeks: 2
                      mean_visit_duration: 120.0
                      radius_max_m: 0.0
                      radius_p95_m: 0.0
                      observation_coverage: 1.0
                    coverage:
                      observed_minutes: 1200.0
                      observed_days: 7
                      calendar_span_days: 10
                      observed_day_fraction: 0.7
                      observed_time_fraction: 0.09615384615384616
                      night_observed_days: 5
                      work_observed_days: 5
                      first_timestamp: '2024-01-01T02:00:00+00:00'
                      last_timestamp: '2024-01-09T18:00:00+00:00'
                    diagnostics:
                      input_points: 250
                      invalid_coordinates: 0
                      invalid_timestamps: 0
                      invalid_rows_removed: 0
                      invalid_altitudes: 0
